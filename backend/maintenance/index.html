<html class='no-js' lang='en'>
	<!--<![endif]-->
	<head>
		<meta charset='utf-8' />
		<meta content='IE=edge,chrome=1' http-equiv='X-UA-Compatible' />
		<title>Hotelinking - maintenance</title>	
		
		<link rel="shortcut icon" href="favicon.ico" />
		<link rel="apple-touch-icon" href="images/favicon.png" />

        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">

        <link rel="stylesheet" href="http://app.hotelinking.com/maintenance/css/maximage.css" type="text/css" media="screen" charset="utf-8" />
		<link rel="stylesheet" href="http://app.hotelinking.com/maintenance/css/styles.css" type="text/css" media="screen" charset="utf-8" />
        <link rel="stylesheet" href="https://app.hotelinking.com/maintenance/css/maximage.css" type="text/css" media="screen" charset="utf-8" />
        <link rel="stylesheet" href="https://app.hotelinking.com/maintenance/css/styles.css" type="text/css" media="screen" charset="utf-8" />

		<!--[if lt IE 9]><script src="http://html5shim.googlecode.com/svn/trunk/html5.js"></script><![endif]-->
		
		<!--[if IE 6]>
			<style type="text/css" media="screen">
				.gradient {display:none;}
			</style>
		<![endif]-->
	</head>
	<body>
		<!-- Switch to full screen -->
		<button class="full-screen" onclick="$(document).toggleFullScreen()"></button>

		<!-- Site Logo -->
		<div id="logo"><img src="https://app.hotelinking.com/public/images/hotelinking_logo.svg" width="175" alt="logo"></div>

		<!-- Home Page -->
		<section class="content show" id="home">
			<h1>We will be right back...</h1>
			<h5>We are performing maintenance tasks</h5>
			<p>We are updating our platform right now, please come back shortly to see the new awesome features we been working on the last weeks.</p>
            <h2>Estimated time between 6am until 8am</h2>
		</section>

		<!-- Background Slides -->
		<div id="maximage">
			<div>
				<img src="http://hotelinking.com/wp-content/uploads/2015/08/2-1-optimized.jpg" alt="" />
				<img class="gradient" src="maintenance/images/backgrounds/gradient.png" alt="" />
			</div>
		</div>
		
		<script src='http://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js'></script>
		<script src="maintenance/js/jquery.easing.min.js" type="text/javascript" charset="utf-8"></script>
		<script src="maintenance/js/jquery.cycle.all.js" type="text/javascript" charset="utf-8"></script>
		<script src="maintenance/js/jquery.maximage.js" type="text/javascript" charset="utf-8"></script>
		<script src="maintenance/js/jquery.fullscreen.js" type="text/javascript" charset="utf-8"></script>
		<script src="maintenance/js/jquery.ba-hashchange.js" type="text/javascript" charset="utf-8"></script>
		<script src="maintenance/js/main.js" type="text/javascript" charset="utf-8"></script>
		
		<script type="text/javascript" charset="utf-8">
			$(function(){
				$('#maximage').maximage({
					cycleOptions: {
						fx: 'fade',
						speed: 1000, // Has to match the speed for CSS transitions in jQuery.maximage.css (lines 30 - 33)
						timeout: 5000,
						prev: '#arrow_left',
						next: '#arrow_right',
						pause: 0,
						before: function(last,current){
							if(!$.browser.msie){
								// Start HTML5 video when you arrive
								if($(current).find('video').length > 0) $(current).find('video')[0].play();
							}
						},
						after: function(last,current){
							if(!$.browser.msie){
								// Pauses HTML5 video when you leave it
								if($(last).find('video').length > 0) $(last).find('video')[0].pause();
							}
						}
					},
					onFirstImageLoaded: function(){
						jQuery('#cycle-loader').hide();
						jQuery('#maximage').fadeIn('fast');
					}
				});
	
				// Helper function to Fill and Center the HTML5 Video
				jQuery('video,object').maximage('maxcover');
	
			});
		</script>
  </body>
