definitions:
  steps:
    - step: &build-image
        name: Build Docker Image
        services:
          - docker
        caches:
          - docker
        script:
          - apt-get update && apt-get install -y unzip git
          - export BRANCH=$(git branch | grep \* | cut -d ' ' -f2)
          - >
            if [ "$BRANCH" == "master" ]; then
              BUILD_ENV="prod"
              REDIS_URL="tcp://red-re-y7jhusqwsnme.4e2iwa.ng.0001.euw1.cache.amazonaws.com:6379?weight=1"
            else
              BUILD_ENV="dev"
              REDIS_URL="tcp://red-re-11r6m9qg5fjf3.ttobjx.0001.euw1.cache.amazonaws.com:6379?weight=1"
            fi
          - rm -f ./backend/app/config.php
          - cd backend/app && rm -f config.php && cp config-$BUILD_ENV.php config.php && cp folders.php.example folders.php && cp debug.php.example debug.php && cd ..
          - docker build -t $BUILD_ENV-app:latest ./ --build-arg APP_ENV=$BUILD_ENV --build-arg  REDIS_URL=$REDIS_URL
          - docker save -o app-image.docker $BUILD_ENV-app:latest 
        artifacts:
          - backend/app-image.docker
    - step: &push-image
        name: Push Docker Image
        oidc: true
        script:
          - docker load -i ./backend/app-image.docker
          - pipe: atlassian/aws-ecr-push-image:2.4.2
            variables:
              AWS_OIDC_ROLE_ARN: $AWS_OIDC_ROLE_ARN
              AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
              IMAGE_NAME: ${ENV_NAME}-app
              DEBUG: "true"
    - step: &deploy-ecs
        name: Deploy to ECS
        image: amazon/aws-cli  
        oidc: true
        script:
          - pipe: atlassian/aws-ecs-deploy:1.13.0
            variables:
              AWS_OIDC_ROLE_ARN: $AWS_OIDC_ROLE_ARN
              AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
              CLUSTER_NAME: '${ENV_NAME}-app'
              SERVICE_NAME: '${ENV_NAME}-app'
              FORCE_NEW_DEPLOYMENT: "true"
              DEBUG: "true"

pipelines:
  branches:
    master:
      - step: *build-image
      - stage:
          name: Deploy to Prod
          deployment: production
          steps:
          - step: *push-image
          - step: *deploy-ecs
    develop:
      - step: *build-image
      - stage:
          name: Deploy to Dev
          deployment: test
          steps:
          - step: *push-image
          - step: *deploy-ecs
    pull-requests:
    '**':
      - step: *build-image
